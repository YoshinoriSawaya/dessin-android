<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>デッサン人形</title>
<style>
:root{
  /* layout: full-height 3D stage on top, compact control sheet pinned to the bottom (phone portrait first) */
  --paper:#e6e4df;
  --panel:#f7f6f3;
  --ink:#23221e;
  --muted:#6b675e;
  --line:#d3d0c7;
  --accent:#d9481f;
  --rom:#1f9d75;
  --font:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);color-scheme:light;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
#stage{position:relative;flex:1 1 auto;min-height:0;background:var(--paper)}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.fail{margin:24px 16px;line-height:1.7}
#hint{position:absolute;left:12px;right:12px;top:10px;margin:0;font-size:12px;line-height:1.6;color:var(--muted);pointer-events:none}
#hint[hidden]{display:none}
#legend{position:absolute;left:12px;bottom:8px;margin:0;display:flex;flex-wrap:wrap;gap:2px 12px;font-size:11px;color:var(--muted);pointer-events:none}
#legend[hidden]{display:none}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.dot.rom{background:var(--rom);opacity:.7}
.dot.grab{background:var(--accent)}
.dot.next{background:transparent;border:1px solid var(--muted)}
#panel{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(35,34,30,.06)}
.head{display:flex;align-items:center;gap:8px}
.sel{flex:1;min-width:0;display:flex;flex-direction:column}
.k{font-size:11px;color:var(--muted)}
#selLabel{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ghost{min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:transparent;font-size:13px;white-space:nowrap}
.ghost:disabled{opacity:.35;cursor:default}
#fold{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:transparent;font-size:14px;line-height:1}
#fold[aria-expanded="false"]{transform:rotate(180deg)}
#body[hidden]{display:none}
.info{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.5}
.ctl{display:flex;align-items:center;gap:8px;margin-top:2px}
.sliders{flex:1;min-width:0;display:flex;flex-direction:column}
.orbwrap{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:0}
.orbwrap .k{font-size:10px}
#orb{display:block;touch-action:none;cursor:grab}
.row{display:grid;grid-template-columns:6.2em 1fr 3.4em;align-items:center;gap:8px;min-height:32px}
.row[hidden]{display:none}
.row label{font-size:13px}
.row output{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
input[type=range]{width:100%;margin:0;height:28px;accent-color:var(--accent)}
input[type=range]:disabled{opacity:.3}
.group{display:flex;align-items:center;gap:10px;margin-top:6px}
.gl{flex:0 0 auto;width:3.2em;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x;padding:2px 0;scrollbar-width:none;align-items:center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:34px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;white-space:nowrap}
.chip.avail{border:1px dashed var(--accent)}
.chip.placed{border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:default}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.sep{flex:0 0 1px;align-self:stretch;margin:6px 2px;background:var(--line)}
@media (max-height:620px){ #hint{display:none} }
</style>
</head>
<body>
<div id="stage">
  <p id="hint">まず肋骨をドラッグして置き、大きさや傾きを決める。下の部位から順に選び、緑の範囲の中をドラッグして向きを決める。</p>
  <p id="legend"><span><i class="dot rom"></i>可動域</span><span><i class="dot grab"></i>ドラッグする点</span><span><i class="dot next"></i>次に置ける部位</span></p>
</div>
<section id="panel" aria-label="部位の配置">
  <div class="head">
    <div class="sel"><span class="k">選択中の部位</span><strong id="selLabel">-</strong></div>
    <button id="jReset" class="ghost" type="button">向きを戻す</button>
    <button id="del" class="ghost" type="button">外す</button>
    <button id="fold" type="button" aria-expanded="true" aria-controls="body" aria-label="パネルを折りたたむ">▾</button>
  </div>
  <div id="body">
    <p class="info" id="selInfo"></p>
    <div class="ctl"><div class="sliders">
      <div class="row" id="row1"><label for="r1" id="l1">-</label><input id="r1" type="range" step="1" value="0"><output id="v1">0</output></div>
      <div class="row" id="row2" hidden><label for="r2" id="l2">-</label><input id="r2" type="range" step="1" value="0"><output id="v2">0</output></div>
      <div class="row" id="row3" hidden><label for="r3" id="l3">-</label><input id="r3" type="range" step="1" value="0"><output id="v3">0</output></div>
      <div class="row" id="row4" hidden><label for="r4" id="l4">-</label><input id="r4" type="range" step="1" value="0"><output id="v4">0</output></div>
    </div>
    <div class="orbwrap"><canvas id="orb" role="img" aria-label="回転球。ドラッグでひねりと傾きを操作します"></canvas><span class="k">球をドラッグ</span></div>
    </div>
    <div class="group"><span class="gl">部位</span><div class="chips" id="partChips"></div></div>
    <div class="group"><span class="gl">表示</span><div class="chips" id="toolChips"></div></div>
  </div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var D2R = Math.PI/180;
  var stage = $('stage');

  if (typeof THREE === 'undefined') {
    stage.innerHTML = '<p class="fail">3Dライブラリを読み込めませんでした。通信状況を確認して、ページを開き直してください。</p>';
    return;
  }
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({antialias:true});
  } catch (err) {
    stage.innerHTML = '<p class="fail">この端末では3D表示を開始できませんでした。ブラウザを更新するか、別のブラウザで開いてください。</p>';
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  stage.insertBefore(renderer.domElement, stage.firstChild);

  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe6e4df);
  var camera = new THREE.PerspectiveCamera(35, 1, 0.1, 60);

  scene.add(new THREE.HemisphereLight(0xffffff, 0x9d988c, 0.75));
  var sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(2.2, 4.5, 3.2);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -2; sun.shadow.camera.right = 2;
  sun.shadow.camera.top = 2.5; sun.shadow.camera.bottom = -2;
  sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 12;
  scene.add(sun);

  var floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.ShadowMaterial({opacity:0.2}));
  floor.rotation.x = -Math.PI/2;
  floor.receiveShadow = true;
  scene.add(floor);
  var grid = new THREE.GridHelper(6, 12, 0xb7b3a8, 0xcdcac1);
  grid.position.y = 0.001;
  scene.add(grid);

  function V(x,y,z){ return new THREE.Vector3(x,y,z); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  /* ---------- materials and shapes ---------- */
  var matBase  = new THREE.MeshStandardMaterial({color:0xdcd8cf, roughness:0.85, metalness:0});
  var matMark  = new THREE.MeshStandardMaterial({color:0xb8b3a6, roughness:0.8, metalness:0});
  var matHot   = new THREE.MeshStandardMaterial({color:0xf0b29b, roughness:0.8, metalness:0, emissive:0x3d1409});
  var matGhost = new THREE.MeshStandardMaterial({color:0xa39e92, roughness:0.9, metalness:0, transparent:true, opacity:0.26, depthWrite:false});
  var edgeMat  = new THREE.LineBasicMaterial({color:0x58534a});
  var romMat   = new THREE.MeshBasicMaterial({color:0x1f9d75, transparent:true, opacity:0.34, side:THREE.DoubleSide, depthWrite:false, depthTest:false});
  var romLine  = new THREE.LineBasicMaterial({color:0x0f7a58, depthTest:false});
  var dotMat   = new THREE.MeshBasicMaterial({color:0xd9481f, depthTest:false});
  var dotRing  = new THREE.MeshBasicMaterial({color:0xffffff, depthTest:false, side:THREE.BackSide});
  var dotGeo   = new THREE.SphereGeometry(1, 16, 12);

  function cylGeo(r,h){ return new THREE.CylinderGeometry(r, r, h, 20); }
  function boxGeo(w,h,d){ return new THREE.BoxGeometry(w, h, d); }
  function sphGeo(r){ return new THREE.SphereGeometry(r, 18, 14); }
  var qZ90 = new THREE.Quaternion().setFromAxisAngle(V(0,0,1), Math.PI/2);

  /* surface lines (median line, contour rings) drawn as thin tubes so they stay visible at any zoom */
  var matMask = new THREE.MeshStandardMaterial({color:0xf3f0e8, roughness:0.7, metalness:0, side:THREE.DoubleSide});
  var lineMat = new THREE.MeshBasicMaterial({color:0xb02a2a});
  var LE = 0.0025;
  function densify(pts, closed, step){
    var out = [], n = pts.length;
    for (var i = 0; i < n; i++) {
      var a = pts[i];
      if (!closed && i === n-1) { out.push(a.clone()); break; }
      var b = pts[(i+1)%n];
      var k = Math.max(1, Math.ceil(a.distanceTo(b)/step));
      for (var j = 0; j < k; j++) out.push(a.clone().lerp(b, j/k));
    }
    return out;
  }
  function cl(mesh, pts, closed){
    var dp = densify(pts, closed, 0.015);
    var curve = new THREE.CatmullRomCurve3(dp, closed, 'centripetal');
    var t = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(8, dp.length*2), 0.0028, 4, closed), lineMat);
    t.userData.cl = true;
    mesh.add(t);
    return t;
  }
  function circlePts(r, plane, y){
    var out = [];
    for (var i = 0; i < 48; i++) {
      var t = i/48*2*Math.PI, c = Math.cos(t)*r, s = Math.sin(t)*r;
      out.push(plane === 'xz' ? V(c, y, s) : V(0, c, s));
    }
    return out;
  }
  function boxLines(m, w, h, d, ys){
    cl(m, [V(0,-h/2,d/2+LE), V(0,h/2,d/2+LE)], false);
    cl(m, [V(0,-h/2,-d/2-LE), V(0,h/2,-d/2-LE)], false);
    ys.forEach(function(y){
      cl(m, [V(-w/2-LE,y,-d/2-LE), V(w/2+LE,y,-d/2-LE), V(w/2+LE,y,d/2+LE), V(-w/2-LE,y,d/2+LE)], true);
    });
  }
  function cylLines(m, r, h, ring){
    cl(m, [V(0,-h/2,r+LE), V(0,h/2,r+LE)], false);
    if (ring) cl(m, circlePts(r+LE, 'xz', 0), true);
  }
  function frustumGeo(rt, rb, h, k){
    var g = new THREE.CylinderGeometry(rt, rb, h, 28);
    g.scale(1, 1, k);
    return g;
  }
  function frustumLines(m, rt, rb, h, k, ys){
    function rad(y){ return rb + (rt - rb)*((y + h/2)/h); }
    cl(m, [V(0,-h/2,k*rb+LE), V(0,h/2,k*rt+LE)], false);
    cl(m, [V(0,-h/2,-k*rb-LE), V(0,h/2,-k*rt-LE)], false);
    ys.forEach(function(y){
      var r = rad(y) + LE, out = [];
      for (var i = 0; i < 48; i++) { var t = i/48*2*Math.PI; out.push(V(r*Math.cos(t), y, k*r*Math.sin(t))); }
      cl(m, out, true);
    });
  }
  function headLines(m, r){
    cl(m, circlePts(r, 'yz', 0), true);
    cl(m, circlePts(r, 'xz', 0), true);
  }

  /* ---------- parts ---------- */
  var parts = {};
  var specs = [];
  function spec(o){ specs.push(o); }
  function mk(p, geo, pos, quat, edges, marker){
    var m = new THREE.Mesh(geo, marker ? matMark : matBase);
    m.position.set(pos[0], pos[1], pos[2]);
    if (quat) m.quaternion.copy(quat);
    m.userData.part = p.name;
    m.userData.marker = !!marker;
    if (edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 30), edgeMat));
    p.J.add(m);
    p.meshes.push(m);
    return m;
  }

  /* cone: how far the tip may swing from its rest direction, per direction.
     Fq: toward +z (front), Bq: toward -z, Xp / Xn: toward +x / -x of the base frame (degrees). */
  spec({name:'rib', label:'肋骨', root:true, build:function(p){
    var m = mk(p, frustumGeo(0.115, 0.095, 0.30, 0.64), [0,0,0], null, true);
    frustumLines(m, 0.115, 0.095, 0.30, 0.64, [0.06, -0.07]);
  }});
  spec({name:'neck', label:'首', parent:'rib', attach:V(0,0.15,0), a0:V(0,1,0), L:0.07, rVis:0.2,
    cone:{Fq:45,Bq:50,Xp:35,Xn:35}, roll:[-30,30], build:function(p){
      cylLines(mk(p, cylGeo(0.032,0.07), [0,0.035,0], null, true), 0.032, 0.07, false);
      mk(p, sphGeo(0.038), [0,0,0], null, false, true);
  }});
  spec({name:'head', label:'頭', scalable:true, parent:'neck', attach:V(0,0.07,0), a0:V(0,1,0), L:0.115, rVis:0.22,
    cone:{Fq:35,Bq:45,Xp:30,Xn:30}, roll:[-60,60], build:function(p){
      headLines(mk(p, new THREE.SphereGeometry(0.098,24,18), [0,0.115,0], null, false), 0.1005);
      /* face mask: a curved plate on the front of the head */
      var mgeo = new THREE.SphereGeometry(0.125,32,24,Math.PI/2-0.95,1.9,Math.PI/2-0.7,1.9);
      mgeo.scale(1, 1.25, 1);
      var mask = mk(p, mgeo, [0,0.115,0], null, true);
      mask.userData.mask = true;
      var mp = [];
      for (var q = 0; q <= 12; q++) {
        var th = (Math.PI/2 - 0.7) + 1.9*q/12;
        mp.push(V(0, 1.25*(0.125+LE)*Math.cos(th), (0.125+LE)*Math.sin(th)));
      }
      cl(mask, mp, false);
      var ep = [];
      for (var w = 0; w <= 16; w++) {
        var ph = (Math.PI/2 - 0.95) + 1.9*w/16;
        ep.push(V(-(0.125+LE)*Math.cos(ph), 0, (0.125+LE)*Math.sin(ph)));
      }
      cl(mask, ep, false);
  }});
  spec({name:'pelvis', label:'骨盤', widthPelvis:true, parent:'rib', attach:V(0,-0.15,-0.035), a0:V(0,-1,0), L:0.07, rVis:0.2,
    cone:{Fq:70,Bq:35,Xp:35,Xn:35}, roll:[-45,45], build:function(p){
      frustumLines(mk(p, frustumGeo(0.10, 0.12, 0.14, 0.68), [0,-0.07,0.035], null, true), 0.10, 0.12, 0.14, 0.68, [0]);
      mk(p, sphGeo(0.04), [0,0,0], null, false, true);
  }});

  [['L',1],['R',-1]].forEach(function(sd){
    var S = sd[0], sg = sd[1], N = (S === 'L') ? '左' : '右';
    spec({name:'clav'+S, label:N+'肩', parent:'rib', attach:V(sg*0.025,0.12,0), a0:V(sg,0,0), L:0.12, rVis:0.2, side:S, widthLink:true,
      cone:{Fq:20,Bq:20,Xp:35,Xn:15}, roll:[0,0], build:function(p){
        cylLines(mk(p, cylGeo(0.022,0.12), [sg*0.06,0,0], qZ90, true), 0.022, 0.12, false);
    }});
    spec({name:'upperArm'+S, label:N+'上腕', parent:'clav'+S, attach:V(sg*0.12,0,0), a0:V(0,-1,0), L:0.25, rVis:0.25, side:S,
      cone:{Fq:180,Bq:60,Xp:180,Xn:30}, roll:[-90,90], build:function(p){
        cylLines(mk(p, cylGeo(0.032,0.24), [0,-0.125,0], null, true), 0.032, 0.24, true);
        mk(p, sphGeo(0.045), [0,0,0], null, false, true);
    }});
    spec({name:'forearm'+S, label:N+'前腕', parent:'upperArm'+S, attach:V(0,-0.25,0), a0:V(0,-1,0), L:0.23, rVis:0.23, side:S,
      hinge:{psi:Math.PI, max:150, min:-15}, roll:[-80,80], build:function(p){
        cylLines(mk(p, cylGeo(0.028,0.22), [0,-0.11,0], null, true), 0.028, 0.22, true);
        mk(p, sphGeo(0.036), [0,0,0], null, false, true);
    }});
    spec({name:'hand'+S, label:N+'手', parent:'forearm'+S, attach:V(0,-0.23,0), a0:V(0,-1,0), L:0.10, rVis:0.2, side:S,
      cone:{Fq:60,Bq:60,Xp:25,Xn:25}, roll:[0,0], build:function(p){
        cl(mk(p, boxGeo(0.062,0.09,0.024), [0,-0.05,0], null, true), [V(0,-0.045,0.012+LE), V(0,0.045,0.012+LE)], false);
        mk(p, sphGeo(0.026), [0,0,0], null, false, true);
    }});
    spec({name:'hip'+S, label:N+'付け根', parent:'pelvis', attach:V(sg*0.025,-0.11,0.035), a0:V(sg,0,0), L:0.05, rVis:0.18, side:S,
      cone:{Fq:25,Bq:25,Xp:25,Xn:20}, roll:[0,0], build:function(p){
        mk(p, cylGeo(0.03,0.05), [sg*0.025,0,0], qZ90, false);
    }});
    spec({name:'thigh'+S, label:N+'もも', parent:'hip'+S, attach:V(sg*0.05,0,0), a0:V(0,-1,0), L:0.40, rVis:0.4, side:S,
      cone:{Fq:120,Bq:30,Xp:70,Xn:30}, roll:[-45,45], build:function(p){
        cylLines(mk(p, cylGeo(0.052,0.39), [0,-0.2,0], null, true), 0.052, 0.39, true);
        mk(p, sphGeo(0.055), [0,0,0], null, false, true);
    }});
    spec({name:'shin'+S, label:N+'すね', parent:'thigh'+S, attach:V(0,-0.40,0), a0:V(0,-1,0), L:0.38, rVis:0.38, side:S,
      hinge:{psi:0, max:150}, roll:[0,0], build:function(p){
        cylLines(mk(p, cylGeo(0.038,0.37), [0,-0.19,0], null, true), 0.038, 0.37, true);
        mk(p, sphGeo(0.044), [0,0,0], null, false, true);
    }});
    spec({name:'foot'+S, label:N+'足', parent:'shin'+S, attach:V(0,-0.38,0), a0:V(0,0,1), ref:V(0,1,0), L:0.16, rVis:0.2, side:S,
      cone:{Fq:20,Bq:45,Xp:20,Xn:20}, roll:[0,0], build:function(p){
        cl(mk(p, boxGeo(0.075,0.045,0.20), [0,-0.04,0.05], null, true), [V(0,0.0225+LE,-0.10), V(0,0.0225+LE,0.10)], false);
        mk(p, sphGeo(0.036), [0,0,0], null, false, true);
    }});
  });

  var CHIP_ORDER = ['rib','|','clavL','clavR','neck','pelvis','|','upperArmL','upperArmR','head','hipL','hipR','|',
    'forearmL','forearmR','thighL','thighR','|','handL','handR','shinL','shinR','|','footL','footR'];

  /* base frame: its -y axis is the rest direction a0, its z axis is as close to ref as possible */
  function baseQuat(a0, ref){
    var by = a0.clone().negate();
    var bx = V(0,0,0).crossVectors(by, ref).normalize();
    var bz = V(0,0,0).crossVectors(bx, by);
    return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(bx, by, bz));
  }
  /* direction in the base frame for swing angle phi from rest and heading psi (psi 0 = toward -z of the base frame) */
  function dirVec(phi, psi){
    var sp = Math.sin(phi);
    return V(sp*Math.sin(psi), -Math.cos(phi), -sp*Math.cos(psi));
  }
  function phiMax(p, psi){
    if (p.hinge) return p.hinge.max;
    var s = Math.sin(psi), c = Math.cos(psi);
    var su = Math.max(0.001, s >= 0 ? p.cone.Xp : p.cone.Xn);
    var sw = Math.max(0.001, c >= 0 ? p.cone.Bq : p.cone.Fq);
    var m = 1/Math.sqrt((s/su)*(s/su) + (c/sw)*(c/sw));
    return Math.min(Math.PI, m);
  }

  function makePart(s){
    var p = {name:s.name, label:s.label, spec:s, parent:null, children:[], root:!!s.root, placed:!!s.root,
             meshes:[], state:{phi:0, psi:0, roll:0}, scalable:!!s.scalable, size:1, widthLink:!!s.widthLink, widthPelvis:!!s.widthPelvis, wscale:1, hipInset:0.0407};
    var J = new THREE.Group();
    p.J = J;
    if (s.root) {

    octx.restore();
    var g = octx.createRadialGradient(c - R*0.35, c - R*0.4, R*0.1, c, c, R);
    g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d6d2c8');
    octx.beginPath(); octx.arc(c, c, R, 0, 2*Math.PI);
    octx.fillStyle = g; octx.fill();
    octx.lineWidth = 1; octx.strokeStyle = '#8f8a7e'; octx.stroke();
    updateCamera();
    var jq = new THREE.Quaternion();
    sel.J.getWorldQuaternion(jq);
    var full = camera.quaternion.clone().invert().multiply(jq);
    function proj(u){
      var v = u.clone().applyQuaternion(full);
      return {x:c + R*v.x, y:c - R*v.y, z:v.z};
    }
    [['xz','#2f6fb0'], ['yz','#1f9d75'], ['xy','#b02a2a']].forEach(function(r){
      var prev = null;
      for (var i = 0; i <= 64; i++) {
        var t = i/64*2*Math.PI, cs = Math.cos(t), sn = Math.sin(t);
        var u = r[0] === 'xz' ? V(cs,0,sn) : (r[0] === 'yz' ? V(0,cs,sn) : V(cs,sn,0));
        var pt = proj(u);
        if (prev) {
          var front = (prev.z + pt.z) >= 0;
          octx.beginPath(); octx.moveTo(prev.x, prev.y); octx.lineTo(pt.x, pt.y);
          octx.strokeStyle = r[1]; octx.globalAlpha = front ? 0.95 : 0.22; octx.lineWidth = front ? 1.6 : 1;
          octx.stroke();
        }
        prev = pt;
      }
    });
    octx.globalAlpha = 1;
    [[V(0,0,1), '#d9481f', '前'], [V(0,1,0), '#23221e', '上']].forEach(function(m){
      var pt = proj(m[0]);
      octx.globalAlpha = pt.z >= 0 ? 1 : 0.3;
      octx.beginPath(); octx.arc(pt.x, pt.y, 6, 0, 2*Math.PI);
      octx.fillStyle = m[1]; octx.fill();
      octx.fillStyle = '#ffffff'; octx.font = '9px sans-serif';
      octx.textAlign = 'center'; octx.textBaseline = 'middle';
      octx.fillText(m[2], pt.x, pt.y + 0.5);
    });
    octx.globalAlpha = 1;
  }

  /* Rotate the selected part by dw (a rotation in world space); the swing is clamped to its range of motion. */
  function sphereRotate(dw){
    if (sel.root) {
      rib.J.quaternion.premultiply(dw);
      return;
    }
    var p = sel;
    var pq = new THREE.Quaternion();
    p.J.parent.getWorldQuaternion(pq);
    var loc = pq.clone().invert().multiply(dw).multiply(pq);
    var jq = loc.multiply(p.J.quaternion);
    var rB = p.QbInv.clone().multiply(jq).multiply(p.Qb);
    var ax = V(0,-1,0);
    var sAx = ax.x*rB.x + ax.y*rB.y + ax.z*rB.z;
    var roll = 2*Math.atan2(sAx, rB.w);
    var tl = Math.sqrt(sAx*sAx + rB.w*rB.w);
    var tw = tl < 1e-6 ? new THREE.Quaternion(0,0,0,1)
                       : new THREE.Quaternion(ax.x*sAx/tl, ax.y*sAx/tl, ax.z*sAx/tl, rB.w/tl);
    var sw = rB.clone().multiply(tw.invert());
    var d = ax.clone().applyQuaternion(sw);
    var t = Math.PI*2;
    roll = ((roll + Math.PI) % t + t) % t - Math.PI;
    var s = p.state;
    if (p.hinge) {
      var hx = -Math.cos(p.hinge.psi);
      s.phi = clamp(Math.atan2(d.z*hx, -d.y), p.hinge.min, p.hinge.max);
    } else {
      var phi = Math.acos(clamp(-d.y, -1, 1));
      if (phi > 1e-3) s.psi = Math.atan2(d.x, -d.z);
      s.phi = Math.min(phi, phiMax(p, s.psi));
    }
    s.roll = clamp(roll, p.roll[0], p.roll[1]);
    applyState(p);
  }

  var orbDrag = null;
  orb.addEventListener('pointerdown', function(e){
    try { orb.setPointerCapture(e.pointerId); } catch (err) {}
    var r = orb.getBoundingClientRect();
    var cx = r.left + r.width/2, cy = r.top + r.height/2;
    var dx = e.clientX - cx, dy = e.clientY - cy;
    orbDrag = {x:e.clientX, y:e.clientY, cx:cx, cy:cy, rim:Math.hypot(dx, dy) > (ORB/2 - 7)*0.78, ang:Math.atan2(-dy, dx)};
  });
  orb.addEventListener('pointermove', function(e){
    if (!orbDrag) return;
    updateCamera();
    var q = new THREE.Quaternion();
    if (orbDrag.rim) {
      var a = Math.atan2(-(e.clientY - orbDrag.cy), e.clientX - orbDrag.cx);
      var da = a - orbDrag.ang;
      if (da > Math.PI) da -= 2*Math.PI;
      if (da < -Math.PI) da += 2*Math.PI;
      orbDrag.ang = a;
      q.setFromAxisAngle(V(0,0,1).applyQuaternion(camera.quaternion), da);
    } else {
      var k = Math.PI/(2*(ORB/2 - 7));
      var ddx = e.clientX - orbDrag.x, ddy = e.clientY - orbDrag.y;
      orbDrag.x = e.clientX; orbDrag.y = e.clientY;
      var qa = new THREE.Quaternion().setFromAxisAngle(V(0,1,0).applyQuaternion(camera.quaternion), ddx*k);
      var qb = new THREE.Quaternion().setFromAxisAngle(V(1,0,0).applyQuaternion(camera.quaternion), ddy*k);
      q.copy(qa).multiply(qb);
    }
    sphereRotate(q);
    syncUI();
    dirty = true;
  });
  function orbEnd(){ orbDrag = null; }
  orb.addEventListener('pointerup', orbEnd);
  orb.addEventListener('pointercancel', orbEnd);

  /* ---------- loop ---------- */
  function updateGuide(){
    if (!sel.dot || !sel.dot.visible) return;
    sel.dot.updateWorldMatrix(true, false);
    var wp = V(0,0,0).setFromMatrixPosition(sel.dot.matrixWorld);
    var ws = sel.J.parent.getWorldScale(V(0,0,0)).x;
    sel.dot.scale.setScalar(0.03*camera.position.distanceTo(wp)/4.3/Math.max(0.01, ws)*1.6);
  }
  function frame(){
    if (dirty) {
      dirty = false;
      updateCamera();
      updateGuide();
      renderer.render(scene, camera);
      drawOrb();
    }
    requestAnimationFrame(frame);
  }

  buildChips();
  configUI();
  refresh();
  fitView();
  requestAnimationFrame(frame);
})();
</script>
